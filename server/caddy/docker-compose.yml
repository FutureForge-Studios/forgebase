# Host-level Caddy: TLS termination for the panel, the SQL editor, and every
# project subdomain (on-demand certs gated by pgforged). host network so it can
# reach services on 127.0.0.1.
name: pgforge-caddy
services:
  caddy:
    image: caddy:2-alpine
    container_name: pgforge-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    network_mode: host
    volumes:
      - /opt/pgforge/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
