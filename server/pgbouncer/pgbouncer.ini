; ForgeBase shared pooler. One instance for every project (transaction mode).
; The auth_file is managed by pgforged (a line per project role); pgforged sends
; SIGHUP to this container after every change. Use port 5432 (direct, TLS) for
; Prisma/session semantics; use this port (6543) for high-concurrency apps.
[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
; Per-(user,db) pool. Transaction pooling makes small pools very effective, and
; the max_* caps make the pooler throttle instead of pushing "too many clients"
; failures into Postgres when many projects are busy at once.
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 2
max_db_connections = 20
max_user_connections = 20
server_idle_timeout = 300
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
admin_users = postgres
