# fail2ban jail for the ForgeBase panel. Installed by apply-infra.sh when
# fail2ban is present. Bans an IP at the firewall after 3 failed panel logins
# within 10 minutes; repeat offenders get escalating bans (bantime.increment).
# Distributed one-attempt-per-IP botnets are handled in the app itself
# (per-account lockout + global surge slowdown) - this jail stops the
# single-IP hammering variety cheaply, before it even reaches the app.
[forgebase-panel]
enabled = true
backend = systemd
filter = forgebase
journalmatch = _SYSTEMD_UNIT=pgforged.service
maxretry = 3
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
