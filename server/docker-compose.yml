# ForgeBase base stack: ONE Postgres cluster + ONE PgBouncer for every project.
# Lives at /opt/pgforge/stack on the server. Secrets come from /opt/pgforge/stack/.env
# (written by install.sh, never committed).
name: pgforge
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pgforge-postgres:17
    container_name: pgforge-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    shm_size: 256mb
    volumes:
      - /opt/pgforge/data:/var/lib/postgresql/data
      - /opt/pgforge/certs:/certs:ro
      - /opt/pgforge-backups/wal:/wal-archive
      - /opt/pgforge-backups/physical:/physical
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      # max_connections is intentionally NOT pinned here: the panel manages it
      # via ALTER SYSTEM (postgresql.auto.conf), which a command-line -c flag
      # would silently override.
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=pgforge
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Segments are gzipped on archive (an idle 16 MB segment shrinks to ~16 KB)
      # and written via a .part temp file so a disk-full mid-copy can never leave
      # a partial file under the final name (that wedges the archiver on retry).
      # archive_timeout=3600: force a segment at most hourly when idle; the
      # off-box copy only ships nightly, so a shorter cadence buys no real RPO.
      - -c
      - archive_command=test ! -f /wal-archive/%f.gz && gzip -c %p > /wal-archive/%f.part && mv /wal-archive/%f.part /wal-archive/%f.gz
      - -c
      - archive_timeout=3600
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgforge-pgbouncer
    restart: unless-stopped
    ports:
      - "6543:6543"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /opt/pgforge/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
