# ForgeBase base stack: ONE Postgres cluster + ONE PgBouncer for every project.
# Lives at /opt/pgforge/stack on the server. Secrets come from /opt/pgforge/stack/.env
# (written by install.sh, never committed).
name: pgforge
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pgforge-postgres:17
    container_name: pgforge-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    shm_size: 256mb
    # Backstop only - the tiered settings below should keep real usage well
    # under this. An in-container OOM kills a backend and postmaster recovers
    # in seconds; without the limit the HOST OOM-killer picks a victim.
    mem_limit: ${PG_MEM_LIMIT:-1536m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - /opt/pgforge/data:/var/lib/postgresql/data
      - /opt/pgforge/certs:/certs:ro
      - /opt/pgforge-backups/wal:/wal-archive
      - /opt/pgforge-backups/physical:/physical
      - /opt/pgforge/bin:/pgforge-bin:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    # RAM-tiered settings: apply-infra.sh detects host RAM and writes PG_* to
    # the stack .env (<=2GB: 256MB/4MB; <=4GB: 512MB/8MB; else 25%/8MB).
    # Defaults here suit a 4GB box.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}
      - -c
      - maintenance_work_mem=${PG_MAINT_WORK_MEM:-64MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - autovacuum_max_workers=${PG_AV_WORKERS:-2}
      # naptime is the per-DATABASE cycle: with dozens of DBs the launcher forks
      # a worker every naptime/N seconds, so keep the cadence relaxed.
      - -c
      - autovacuum_naptime=${PG_AV_NAPTIME:-180}
      # max_connections is intentionally NOT pinned here: the panel manages it
      # via ALTER SYSTEM (postgresql.auto.conf), which a command-line -c flag
      # would silently override.
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=pgforge
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Archiving lives in a host-managed script (bind-mounted) so its logic can
      # be fixed without recreating this container. It gzips via .part + atomic
      # rename, and treats "already archived, identical" as success - the old
      # inline `test ! -f` failed forever on that retry case and could wedge the
      # archiver until pg_wal filled the disk. archive_timeout=3600: force a
      # segment at most hourly when idle (the off-box copy ships nightly).
      - -c
      - archive_command=/pgforge-bin/archive-wal.sh %p %f
      - -c
      - archive_timeout=3600
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgforge-pgbouncer
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "6543:6543"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /opt/pgforge/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - /opt/pgforge/pgbouncer/tls:/tls:ro
    depends_on:
      db:
        condition: service_healthy
